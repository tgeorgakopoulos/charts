  --cur-band:rgba(214,54,55,.13); --two-band:rgba(92,60,146,.14); --one-band:rgba(162,213,198,.45);
  --tip-bg:#222222; --tip-fg:#ffffff;
  --sans:"Geologica",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111111; --fg:#f2f2f2; --muted:#b2b2be; --grid:#262626; --axis:#575760;
  --hist:#f2f2f2; --cur:#f06566; --two:#a88be0; --one:#a2d5c6;
  --cur-band:rgba(240,101,102,.15); --two-band:rgba(168,139,224,.16); --one-band:rgba(162,213,198,.16);
  --tip-bg:#f2f2f2; --tip-fg:#111111; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --fg:#f2f2f2; --muted:#b2b2be; --grid:#262626; --axis:#575760;
  --hist:#f2f2f2; --cur:#f06566; --two:#a88be0; --one:#a2d5c6;
  --cur-band:rgba(240,101,102,.15); --two-band:rgba(168,139,224,.16); --one-band:rgba(162,213,198,.16);
  --tip-bg:#f2f2f2; --tip-fg:#111111; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:clamp(19px,3.2vw,26px);line-height:1.2;font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
.dek{margin:6px 0 0;color:var(--muted);font-size:14.5px;line-height:1.45;max-width:62ch}
.lang{display:flex;border:1px solid var(--grid);border-radius:999px;overflow:hidden;flex:none}
.lang button{font:600 12px var(--sans);letter-spacing:.05em;background:none;color:var(--muted);border:0;padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--one);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--fg)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}
.chart{position:relative;width:100%}
svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--sans);font-variant-numeric:tabular-nums}
.tick text{fill:var(--muted);font-size:12px}
.endlab{font-size:12.5px;font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.45;min-width:170px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-variant-numeric:tabular-nums;transform:translate(-50%,-100%)}
.tip b{display:block;font-size:13px;margin-bottom:3px}
.tip .row{display:flex;justify-content:space-between;gap:14px}
.tip .row em{font-style:normal;opacity:.7}
.tip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.foot{font-size:12px;color:var(--muted);line-height:1.5;border-top:1px solid var(--grid);padding-top:10px}
.foot a{color:inherit}
sub{font-size:.7em;line-height:0;vertical-align:-.25em}
@media (prefers-reduced-motion:no-preference){.draw{transition:opacity .2s}}
</style>
<style>html,body{margin:0}</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div>
      <h1 id="t-title"></h1>
      <p class="dek" id="t-dek"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="b-el" type="button" aria-pressed="true">ΕΛ</button>
      <button id="b-en" type="button" aria-pressed="false">EN</button>
    </div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="chart" id="chart">
    <svg id="svg" viewBox="0 0 760 430" role="img" aria-labelledby="t-title t-dek"></svg>
    <div class="tip" id="tip" hidden></div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
// Data: UNEP Emissions Gap Report 2026 "The point of return" (GtCO2e, incl. LULUCF).
// Current policies: Table ES.2. Pathway medians = current policies minus the ES.2 gaps.
// Pathway ranges = ES.1 % cut ranges applied to 2025 emissions (58.4).
// History: EGR 2026 Fig. ES.1. Labelled: 2016 = 54.2, 2025 = 58.4; 2024 = 58.4 + 0.16 (report text). Other years digitised (±0.3).
const HIST=[[2015,55.0],[2016,54.2],[2017,55.0],[2018,55.6],[2019,55.9],[2020,54.1],[2021,56.2],[2022,57.0],[2023,57.6],[2024,58.6],[2025,58.4]];
const SC={
  cur:{v:{2030:57,2035:55},r:{2030:[53,62],2035:[52,61]}},
  two:{v:{2030:52,2035:45},r:{2030:[45,58],2035:[29,53]}},
  one:{v:{2030:48,2035:33},r:{2030:[37,50],2035:[23,41]}}
};
const OLD={2030:33,2035:25}; // EGR 2025 1.5°C (no/limited overshoot), retired in 2026
const T={
  el:{title:"Το χάσμα ανάμεσα στις πολιτικές και στους στόχους του Παρισιού",
      dek:"Παγκόσμιες εκπομπές αερίων θερμοκηπίου, σε δισ. τόνους ισοδύναμου CO<sub>2</sub> ετησίως. Οι γραμμές μετά το 2025 δείχνουν τη διάμεση εκτίμηση και οι σκιασμένες ζώνες το εύρος των σεναρίων.",
      hist:"Ιστορικές εκπομπές",cur:"Τρέχουσες πολιτικές",two:"Κάτω από 2°C",one:"1,5°C με υπέρβαση",old:"1,5°C χωρίς υπέρβαση (2025)",old_s:"παλιός στόχος",
      two_s:"κάτω από 2°C",one_s:"1,5°C με υπέρβαση",unit:"Gt",range:"εύρος",gt:"δισ. τόνοι CO<sub>2</sub>e",
      gap:"Χάσμα έως 2°C / 1,5°C",
      foot:'Πηγή: UNEP, <a href="https://www.unep.org/en/publications/report/emissions-gap-report-2026" target="_blank" rel="noopener">Emissions Gap Report 2026: The point of return</a> (Πίνακες ES.1, ES.2). Πορεία κάτω από 2°C: πιθανότητα τουλάχιστον 66% σε όλο τον αιώνα. Πορεία 1,5°C με υπέρβαση: κορύφωση στους 1,7–1,8°C και επιστροφή στον 1,5°C έως το 2100 (πιθανότητα 50%). Η διακεκομμένη γραμμή είναι ο στόχος 1,5°C της έκθεσης 2025, που η UNEP θεωρεί πλέον ανέφικτο. Τα εύρη των πορειών υπολογίστηκαν από τα ποσοστιαία εύρη μειώσεων της έκθεσης. Οι ιστορικές τιμές προέρχονται από το Γράφημα ES.1 της έκθεσης (2015, 2017–2023 ψηφιοποιημένες, ±0,3 Gt).'},
  en:{title:"The gap between current policies and the Paris goals",
      dek:"Global greenhouse gas emissions, billion tonnes of CO<sub>2</sub> equivalent per year. Lines after 2025 show the median estimate; shaded bands show the scenario range.",
      hist:"Historical emissions",cur:"Current policies",two:"Below 2°C",one:"1.5°C, with overshoot",old:"1.5°C, no overshoot (2025)",old_s:"retired target",
      two_s:"below 2°C",one_s:"1.5°C w/ overshoot",unit:"Gt",range:"range",gt:"billion t CO<sub>2</sub>e",
      gap:"Gap to 2°C / 1.5°C",
      foot:'Source: UNEP, <a href="https://www.unep.org/en/publications/report/emissions-gap-report-2026" target="_blank" rel="noopener">Emissions Gap Report 2026: The point of return</a> (Tables ES.1, ES.2). Below 2°C: at least a 66% chance throughout the century. 1.5°C with overshoot: warming peaks at 1.7–1.8°C and returns to 1.5°C by 2100 (50% chance). The dashed line is the 2025 report’s 1.5°C pathway, which UNEP now says is out of reach. Pathway ranges are derived from the report’s percentage-cut ranges. Historical values come from the report’s Figure ES.1 (2015 and 2017–2023 digitised, ±0.3 Gt).'}
};
let lang="el";
const W=760,H=430,M={l:46,r:185,t:14,b:34};
const x0=2015,x1=2035,y0=18,y1=64;
const X=y=>M.l+(y-x0)/(x1-x0)*(W-M.l-M.r);
const Y=v=>M.t+(y1-v)/(y1-y0)*(H-M.t-M.b);
const css=n=>`var(--${n})`;
const svg=document.getElementById("svg"),tip=document.getElementById("tip");
const ns="http://www.w3.org/2000/svg";
const el=(n,a,p=svg)=>{const e=document.createElementNS(ns,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const fmt=v=>lang==="el"?String(v).replace(".",","):String(v);

function draw(){
  svg.innerHTML="";
  const t=T[lang];
  // grid + y ticks
  for(let v=20;v<=60;v+=10){
    const g=el("g",{class:"tick"});
    el("line",{x1:M.l,x2:W-M.r+6,y1:Y(v),y2:Y(v),stroke:css("grid"),"stroke-width":1},g);
    el("text",{x:M.l-8,y:Y(v)+4,"text-anchor":"end"},g).textContent=v;
  }
  const yl=el("text",{x:M.l-8,y:M.t-2,"text-anchor":"end",class:"tick"});
  yl.setAttribute("fill",css("muted"));yl.setAttribute("font-size","11");
  // x axis
  el("line",{x1:M.l,x2:X(2035),y1:H-M.b,y2:H-M.b,stroke:css("axis")});
  for(let yr=2015;yr<=2035;yr+=5){
    const g=el("g",{class:"tick"});
    el("line",{x1:X(yr),x2:X(yr),y1:H-M.b,y2:H-M.b+6,stroke:css("axis")},g);
    el("text",{x:X(yr),y:H-M.b+21,"text-anchor":"middle"},g).textContent=yr;
  }
  const last=HIST[HIST.length-1];
  // bands
  for(const k of ["cur","two","one"]){
    const s=SC[k];
    const pts=[[last[0],last[1]],[2030,s.r[2030][1]],[2035,s.r[2035][1]],[2035,s.r[2035][0]],[2030,s.r[2030][0]]];
    el("polygon",{points:pts.map(p=>X(p[0])+","+Y(p[1])).join(" "),fill:css(k+"-band"),stroke:css(k),"stroke-opacity":.35,"stroke-width":.75});
  }
  // scenario lines
  for(const k of ["cur","two","one"]){
    const s=SC[k];
    const pts=[[last[0],last[1]],[2030,s.v[2030]],[2035,s.v[2035]]];
    el("polyline",{points:pts.map(p=>X(p[0])+","+Y(p[1])).join(" "),fill:"none",stroke:css(k),"stroke-width":2.5,"stroke-linejoin":"round"});
    for(const yr of [2030,2035])el("circle",{cx:X(yr),cy:Y(s.v[yr]),r:4.5,fill:css(k)});
  }
  // retired 2025 1.5°C pathway (ghost)
  el("polyline",{points:[[last[0],last[1]],[2030,OLD[2030]],[2035,OLD[2035]]].map(p=>X(p[0])+","+Y(p[1])).join(" "),fill:"none",stroke:css("muted"),"stroke-width":1.5,"stroke-dasharray":"5 4",opacity:.8});
  const ol=el("text",{x:X(2035)+12,y:Y(OLD[2035])+4,fill:css("muted"),"font-size":"11.5"});ol.textContent=t.old;
  // historical
  el("polyline",{points:HIST.map(p=>X(p[0])+","+Y(p[1])).join(" "),fill:"none",stroke:css("hist"),"stroke-width":3,"stroke-linejoin":"round"});
  el("circle",{cx:X(last[0]),cy:Y(last[1]),r:5,fill:css("hist")});
  // direct end labels at 2035
  const ends=[["cur",t.cur],["two",t.two],["one",t.one]];
  for(const [k,lab] of ends){
    const v=SC[k].v[2035];
    const tx=el("text",{x:X(2035)+12,y:Y(v)-2,class:"endlab",fill:css(k)});
    tx.textContent=lab;
    const t2=el("text",{x:X(2035)+12,y:Y(v)+14,fill:css("muted"),"font-size":"12"});
    t2.textContent=v+" "+t.unit;
  }
  const hl=el("text",{x:X(last[0]),y:Y(last[1])-12,"text-anchor":"middle",fill:css("hist"),"font-size":"12","font-weight":"600"});
  hl.textContent=fmt(last[1])+" "+t.unit;
  // hover guide + overlay
  guide=el("line",{x1:0,x2:0,y1:M.t,y2:H-M.b,stroke:css("axis"),"stroke-dasharray":"3 3",visibility:"hidden"});
  const ov=el("rect",{x:M.l,y:M.t,width:X(2035)-M.l+20,height:H-M.t-M.b,fill:"transparent"});
  ov.addEventListener("pointermove",onMove);
  ov.addEventListener("pointerleave",()=>{tip.hidden=true;guide.setAttribute("visibility","hidden")});
  // text bits
  document.getElementById("t-title").textContent=t.title;
  document.getElementById("t-dek").innerHTML=t.dek;
  document.getElementById("foot").innerHTML=t.foot;
  document.getElementById("legend").innerHTML=[["hist",t.hist],["cur",t.cur],["two",t.two],["one",t.one]]
    .map(([k,l])=>`<span><i style="background:var(--${k})"></i>${l}</span>`).join("");
  document.documentElement.lang=lang;
}
let guide;
const YEARS=[...HIST.map(h=>h[0]),2030,2035];
function onMove(e){
  const r=svg.getBoundingClientRect(),sx=W/r.width;
  const px=(e.clientX-r.left)*sx;
  let yr=YEARS.reduce((a,b)=>Math.abs(X(b)-px)<Math.abs(X(a)-px)?b:a);
  const t=T[lang];
  guide.setAttribute("x1",X(yr));guide.setAttribute("x2",X(yr));guide.setAttribute("visibility","visible");
  let html=`<b>${yr}</b>`;
  const row=(k,l,v,rg)=>`<div class="row"><span><span class="dot" style="background:var(--${k})"></span>${l}</span><span>${fmt(v)} ${t.unit}${rg?` <em>(${rg[0]}–${rg[1]})</em>`:""}</span></div>`;
  let topV;
  const h=HIST.find(p=>p[0]===yr);
  if(h){html+=row("hist",t.hist,h[1]);topV=h[1];}
  else{
    html+=row("cur",t.cur,SC.cur.v[yr],SC.cur.r[yr]);
    html+=row("two",t.two_s,SC.two.v[yr],SC.two.r[yr]);
    html+=row("one",t.one_s,SC.one.v[yr],SC.one.r[yr]);
    html+=row("muted",t.old_s,OLD[yr]);
    const g2=SC.cur.v[yr]-SC.two.v[yr],g1=SC.cur.v[yr]-SC.one.v[yr];
    html+=`<div class="row" style="margin-top:4px"><em>${t.gap}</em><span>${g2} / ${g1} ${t.unit}</span></div>`;
    topV=SC.cur.r[yr][1];
  }
  tip.innerHTML=html;tip.hidden=false;
  const cr=document.getElementById("chart").getBoundingClientRect();
  let left=X(yr)/sx,top=Y(topV)/sx-10;
  const half=tip.offsetWidth/2;
  left=Math.max(half,Math.min(cr.width-half,left));
  tip.style.left=left+"px";tip.style.top=Math.max(tip.offsetHeight,top)+"px";
}
function setLang(l){lang=l;document.getElementById("b-el").setAttribute("aria-pressed",l==="el");document.getElementById("b-en").setAttribute("aria-pressed",l==="en");draw();}
document.getElementById("b-el").onclick=()=>setLang("el");
document.getElementById("b-en").onclick=()=>setLang("en");
try{const p=new URLSearchParams(location.search).get("lang")||location.hash.slice(1);if(p==="en")lang="en"}catch(e){}
setLang(lang);
</script>

</body>
</html>
